packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency build scripts unless listed here.
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Build scripts pnpm is allowed to run (pnpm 10 blocks them by default).
onlyBuiltDependencies:
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
